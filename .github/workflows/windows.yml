name: Nova Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Windows/requirements*.txt

      - name: Run Python and JavaScript checks
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r Windows/requirements.txt
          $env:PYTHONPATH = "$PWD/Windows"
          python -m unittest discover -s Windows/tests -v
          node --check app/src/main/assets/ui/app.js
          node --check app/src/main/assets/ui/store.js
          node --check app/src/main/assets/ui/matrix.js

      - name: Build Nova.exe and portable ZIP
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File Windows/build.ps1
          if (-not (Test-Path "Windows/dist/Nova/Nova.exe")) { throw "Nova.exe no fue generado" }
          if (-not (Test-Path "Windows/dist/Nova-Windows-x64.zip")) { throw "El ZIP portable no fue generado" }

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: Nova-2.0.0-Windows-x64-B830
          path: Windows/dist/Nova-Windows-x64.zip
          retention-days: 30
