name: Nova Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  LLAMA_REF: v0.7.0
  LLAMA_COMMIT: 757cad021b357f417065ddbc41a6e8f87c1f8136
  NDK_VERSION: 27.0.12077973

jobs:
  apk:
    name: APK ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;$NDK_VERSION"

      - name: Checkout llama.cpp v0.7.0
        run: |
          git clone --depth 1 --branch "$LLAMA_REF" https://github.com/ggml-org/llama.cpp.git llama.cpp
          test "$(git -C llama.cpp rev-parse HEAD)" = "$LLAMA_COMMIT"

      - name: Build llama-server for ${{ matrix.abi }}
        run: |
          cmake -S llama.cpp -B llama.cpp/build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_RPC=ON \
            -DLLAMA_CURL=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build-android --config Release --parallel 2 --target llama-server
          test -s llama.cpp/build-android/bin/llama-server
          file llama.cpp/build-android/bin/llama-server

      - name: Package native engine
        run: |
          mkdir -p "app/src/main/jniLibs/${{ matrix.abi }}"
          cp llama.cpp/build-android/bin/llama-server \
            "app/src/main/jniLibs/${{ matrix.abi }}/libllama_server.so"
          "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-unneeded "app/src/main/jniLibs/${{ matrix.abi }}/libllama_server.so"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon \
            -PnovaAbi="${{ matrix.abi }}" -Pkotlin.incremental=false

      - name: Collect unsigned APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            "out/Nova-2.0.0-${{ matrix.abi }}-unsigned.apk"
          sha256sum out/*.apk > out/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-2.0.0-${{ matrix.abi }}-unsigned
          path: out/
          retention-days: 30
